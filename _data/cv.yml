- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Researcher | Simons Observatory
      institution: "Princeton, NJ | Mentors: Jo Dunkley, Susanna Azzoni"
      year: 2023 - Present
      description:
        - Led a first-author study of model misspecification in cosmological inference using cross-spectrum component separation and realistic simulation ensembles.
        - Developed regression and template-fitting estimators for multi-frequency polarization data, including weighted cross-template fits, harmonic filtering, and Monte Carlo uncertainty propagation.
        - Designed Bayesian/MCMC and simulation analyses to quantify estimator bias, uncertainty, covariance, chance correlations, and robustness under foreground model misspecification.
        - Built SO×Planck cross-correlation and calibration pipelines to validate instrument performance and foreground measurements against independent data.
    - title: Undergraduate Researcher | Cosmology Large Angular Scale Surveyor
      institution: "Baltimore, MD | Mentors: Charles L. Bennett, Tobias A. Marriage, Ivan L. Padilla"
      year: 2019 - 2023
      description:
        - Implemented and optimized a needlet-domain minimum-variance estimator for multi-frequency signal decomposition.
        - Developed foreground masking and Fourier-space point-source detection methods and benchmarked estimator performance across frequency bands.
        - Built Python diagnostics for temporal anomaly detection in observational time-series data using rolling-dispersion statistics.
    - title: Undergraduate Researcher | Zakamska Astrophysics Group
      institution: "Baltimore, MD | Mentors: Nadia L. Zakamska, Hsiang-Chih Hwang"
      year: 2021 - 2023
      description:
        - First-authored a peer-reviewed study modeling a compact binary system using spectral decomposition and time-series fitting.
        - Developed automated Python pipelines for photometric and spectroscopic feature extraction in the time and frequency domains.

- title: Selected Technical Projects
  type: time_table
  contents:
    - title: Benchmarking Scientific Reasoning in AI Agents | Terminal-Bench-Science
      institution: <a href="https://github.com/harbor-framework/terminal-bench-science">Terminal-Bench-Science</a>
      year: 2026 - Present
      description:
        - Design executable scientific tasks that test whether AI agents construct models that generalize beyond visible evaluation constraints.
        - Authored a CMB inference benchmark targeting model misspecification and restrictive assumptions that can remain statistically adequate on observed data while failing under hidden evaluation conditions.
        - Review astronomy and physics tasks for scientific validity, difficulty, verifier robustness, reproducibility, and potential shortcut solutions.
    - title: Representation Learning and Simulation-Based Inference for Cosmology
      year: 2026 - Present
      description:
        - Developing VICReg-based self-supervised representations of simulated CMB observations for downstream inference of the tensor-to-scalar ratio r.
        - Investigating learned low-dimensional summaries that retain cosmological parameter information while remaining robust to foreground and observational variation.
        - Exploring simulation-based inference for likelihood-free posterior estimation using learned representations.
    - title: Reinforcement Learning for Sequential Auto-Bidding
      institution: <a href="https://github.com/liuyiqiandrew/AuctionNet">AuctionNet</a> · COS 435 group project, Princeton University
      year: Spring 2026
      description:
        - Developed PPO agents for sequential decision making in a replay-based auction environment subject to budget and cost-per-action constraints.
        - Extended the policy with temporal observation stacking and recurrent representations to capture nonstationary market dynamics and long-horizon dependencies.
        - Evaluated reward shaping, market-state features, and alternative policy architectures through controlled experiments and ablations.
    - title: Transformer Inference Systems Benchmarking
      year: Spring 2026
      description:
        - Designed controlled experiments to study the compute–memory tradeoff of KV caching in decoder-only transformers across prompt and generation lengths.
        - Benchmarked decoding throughput, end-to-end latency, cache footprint, and GPU memory behavior under cached and non-cached inference.
        - Characterized cache-memory scaling, prefix reuse, CUDA allocator behavior, and performance degradation under CPU–GPU memory offloading.

